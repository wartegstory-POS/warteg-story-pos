name: Build Warteg Story POS APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "icon.png"
      - "version.json"
      - "updater.js"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: warteg-story-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Root Files and Version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s icon.png
          test -s updater.js
          test -s version.json
          node -e 'const v=require("./version.json"); if(!/^\d+\.\d+\.\d+$/.test(v.version)) process.exit(1); console.log("version="+v.version)' >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        run: npm install

      - name: Build Web Bundle from Root
        run: npm run build

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Warteg Story Launcher Icons
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Image.open('icon.png').convert('RGBA')
          res=Path('android/app/src/main/res')
          sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for density,size in sizes.items():
              folder=res/f'mipmap-{density}'
              folder.mkdir(parents=True,exist_ok=True)
              icon=src.resize((size,size),Image.Resampling.LANCZOS)
              icon.save(folder/'ic_launcher.png')
              icon.save(folder/'ic_launcher_round.png')
          # Adaptive foreground keeps the complete logo inside Android's safe mask area.
          folder=res/'drawable'; folder.mkdir(parents=True,exist_ok=True)
          fg=Image.new('RGBA',(432,432),(0,0,0,0))
          mark=src.copy(); mark.thumbnail((280,280),Image.Resampling.LANCZOS)
          fg.alpha_composite(mark,((432-mark.width)//2,(432-mark.height)//2))
          fg.save(folder/'ic_launcher_foreground.png')
          anydpi=res/'mipmap-anydpi-v26'; anydpi.mkdir(parents=True,exist_ok=True)
          xml='''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/warteg_icon_background"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          '''
          for name in ('ic_launcher.xml','ic_launcher_round.xml'):
              (anydpi/name).write_text(xml,encoding='utf-8')
          values=res/'values'; values.mkdir(parents=True,exist_ok=True)
          (values/'warteg_icon_colors.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources><color name="warteg_icon_background">#97000D</color></resources>
          ''',encoding='utf-8')
          PY

      - name: Set Android Version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('android/app/build.gradle'); s=p.read_text()
          s,n1=re.subn(r'\bversionCode\s+\d+',f'versionCode {os.environ["RUN_NUMBER"]}',s,count=1)
          s,n2=re.subn(r'versionName\s+["\'][^"\']*["\']',f'versionName "{os.environ["VERSION"]}"',s,count=1)
          if n1!=1 or n2!=1: raise SystemExit('Android version fields not found exactly once')
          p.write_text(s)
          PY

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK and OTA Patch ZIP
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Warteg-Story-POS-v${VERSION}.apk"
          cd .build/web
          zip -qr "../../dist/warteg-story-pos-patch.zip" .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Warteg-Story-POS-${{ steps.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (manual run only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Increase version.json first."
            exit 1
          fi
          gh release create "$TAG" \
            "dist/warteg-story-pos-patch.zip" \
            "dist/Warteg-Story-POS-v${VERSION}.apk" \
            --title "Warteg Story POS ${VERSION}" \
            --notes "Warteg Story POS ${VERSION}: APK and OTA web patch bundle." \
            --latest

      - name: Build Summary
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          { echo "## Warteg Story POS"; echo "- Source: repository root (no www folder)"; echo "- Version: ${VERSION}"; echo "- APK and OTA patch artifact created"; echo "- OTA uses @capgo/capacitor-updater manual mode"; } >> "$GITHUB_STEP_SUMMARY"
